# Monoshiri: generic compose. Copy deploy/.env.example to deploy/.env first.
# Build the two images before the first start (see README, Quick start).
# The external networks must exist: docker network create ai-infra
#                                   docker network create --internal mineru-net
name: monoshiri

services:
  db:
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    environment:
      POSTGRES_USER: ${DB_USER:-surfsense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-surfsense}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-surfsense} -d ${DB_NAME:-surfsense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:2026.3.13-3c1f68c59
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Code sandbox for Studio outputs (mind map, flashcards, quiz, slides, reports).
  # It spawns sandbox containers on the host daemon as siblings, so it needs the
  # host socket, and it publishes no host port: only backend and celery_worker
  # reach it, by name, through the server proxy. Sandbox containers themselves
  # publish their port on 20000-30000; firewall that range from untrusted
  # networks on the host (see README).
  opensandbox-server:
    image: opensandbox/server:v0.2.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same secret as OPENSANDBOX_API_KEY in .env; no default, so an empty key fails loudly.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY in .env}
    mem_limit: 512m
    restart: unless-stopped
    # The runtime image ships neither curl nor wget; python is on PATH.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: monoshiri-backend:${MONOSHIRI_VERSION:-local}
    volumes:
      - shared_temp:/shared_tmp
      - conversions:/app/conversions
      - podcasts_data:/app/podcasts
      - video_presentation_audio:/app/video_presentation_audio
      # copy global_llm_config.example.yaml to global_llm_config.yaml and add your API key
      - ./global_llm_config.yaml:/app/app/config/global_llm_config.yaml:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_APP_URL: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      UVICORN_LOOP: asyncio
      UNSTRUCTURED_HAS_PATCHED_LOOP: "1"
      NEXT_FRONTEND_URL: ${NEXT_FRONTEND_URL:-http://localhost:${HTTP_PORT:-8080}}
      SEARXNG_URL: http://searxng:8080
      GOOGLE_SEARCH_FETCH_DEADLINE_S: "8"
      SERVICE_ROLE: api
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ETL_SERVICE: ${ETL_SERVICE:-MINERU}   # DOCLING if you skip MinerU
      MINERU_URL: http://mineru-api:8000   # MINERU_API_KEY via .env
      # Signup is invite-only. Optional env (set in .env), defaults shown:
      #   SIGNUP_OPEN=FALSE          # TRUE = break-glass, anyone can register
      #   INVITE_TTL_SECONDS=604800  # invite link lifetime (7 d)
      # Mint a one-time invite link (prints <NEXT_FRONTEND_URL>/register?invite=<token>):
      #   docker compose exec backend python -m app.monoshiri invite --note "for X" [--days N]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      searxng: { condition: service_healthy }
      opensandbox-server: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 200s
    # lets global_llm_config.yaml reach a model server on the Docker host (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, ai-infra, mineru-net]

  celery_worker:
    image: monoshiri-backend:${MONOSHIRI_VERSION:-local}
    volumes:
      - shared_temp:/shared_tmp
      - conversions:/app/conversions
      - podcasts_data:/app/podcasts
      - video_presentation_audio:/app/video_presentation_audio
      - ./global_llm_config.yaml:/app/app/config/global_llm_config.yaml:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_APP_URL: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      SEARXNG_URL: http://searxng:8080
      GOOGLE_SEARCH_FETCH_DEADLINE_S: "8"
      SERVICE_ROLE: worker
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ETL_SERVICE: ${ETL_SERVICE:-MINERU}
      MINERU_URL: http://mineru-api:8000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
      opensandbox-server: { condition: service_healthy }
    restart: unless-stopped
    # lets global_llm_config.yaml reach a model server on the Docker host (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, ai-infra, mineru-net]

  celery_beat:
    image: monoshiri-backend:${MONOSHIRI_VERSION:-local}
    volumes:
      - podcasts_data:/app/podcasts
      - video_presentation_audio:/app/video_presentation_audio
      - ./global_llm_config.yaml:/app/app/config/global_llm_config.yaml:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      SERVICE_ROLE: beat
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      celery_worker: { condition: service_started }
    restart: unless-stopped

  zero-cache:
    # Live-sync cache for the web UI. Needs wal_level=logical on db (postgresql.conf).
    # It only caches the main tables, so resetting it loses no data.
    image: rocicorp/zero:1.6.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZERO_UPSTREAM_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_CVR_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_CHANGE_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?set ZERO_ADMIN_PASSWORD in .env}
      ZERO_APP_PUBLICATIONS: zero_publication
      ZERO_AUTO_RESET: "true"
      ZERO_NUM_SYNC_WORKERS: 4
      ZERO_UPSTREAM_MAX_CONNS: 20
      ZERO_CVR_MAX_CONNS: 30
      ZERO_QUERY_URL: http://frontend:3000/api/zero/query
      ZERO_MUTATE_URL: http://frontend:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_QUERY_API_KEY: ""
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: 60
      ZERO_AUTH_RETRANSFORM_INTERVAL_SECONDS: 60
    volumes:
      - zero_cache_data:/data
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  frontend:
    image: monoshiri-web:${MONOSHIRI_VERSION:-local}
    environment:
      # Empty = the browser calls the page's own origin, through the reverse proxy.
      NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${NEXT_PUBLIC_FASTAPI_BACKEND_URL:-}
      NEXT_PUBLIC_ZERO_CACHE_URL: ${NEXT_PUBLIC_ZERO_CACHE_URL:-}
      NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE: LOCAL
      NEXT_PUBLIC_ETL_SERVICE: ${ETL_SERVICE:-MINERU}
      ETL_SERVICE: ${ETL_SERVICE:-MINERU}
      NEXT_PUBLIC_DEPLOYMENT_MODE: self-hosted
    depends_on:
      backend: { condition: service_healthy }
      zero-cache: { condition: service_healthy }
    restart: unless-stopped

  # Reverse proxy: the browser talks only to this. Put HTTPS in front or edit Caddyfile.
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
      - zero-cache
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  shared_temp:
  zero_cache_data:
  podcasts_data:
  video_presentation_audio:
  conversions:
  opensandbox_data:

networks:
  ai-infra:
    external: true
  mineru-net:
    external: true
